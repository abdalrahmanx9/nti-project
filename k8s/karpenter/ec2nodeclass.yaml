apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: default
spec:
  amiFamily: AL2023
  role: nti-devops-eks-karpenter-node-role
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: nti-devops-eks
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: nti-devops-eks
  amiSelectorTerms:
    - alias: al2023@latest
  tags:
    karpenter.sh/discovery: nti-devops-eks
    ManagedBy: Karpenter
