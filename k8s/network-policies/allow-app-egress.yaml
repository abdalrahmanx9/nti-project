apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-app-egress
  namespace: default
  labels:
    app.kubernetes.io/name: nti-app
    security.nti.devops/policy: zero-trust
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: nti-app
  policyTypes:
    - Egress
  egress:
    # 1. Allow DNS resolution to CoreDNS in kube-system namespace
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

    # 2. Allow outbound database traffic strictly to RDS PostgreSQL inside VPC on port 5432
    - to:
        - ipBlock:
            cidr: 10.0.0.0/16
      ports:
        - protocol: TCP
          port: 5432
