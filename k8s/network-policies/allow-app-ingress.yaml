apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-app-ingress
  namespace: default
  labels:
    app.kubernetes.io/name: nti-app
    security.nti.devops/policy: zero-trust
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: nti-app
  policyTypes:
    - Ingress
  ingress:
    # Allow incoming HTTP traffic on port 8000 routed via Kubernetes Gateway controller
    - from:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 8000
