[project]
name = "nti-devops-app"
version = "1.0.0"
description = "Cloud-native Python web application for NTI DevOps Final Project with health probes, RDS connectivity, and Prometheus metrics"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "jinja2>=3.1.3",
    "pydantic>=2.6.4",
    "pydantic-settings>=2.2.1",
    "sqlalchemy>=2.0.29",
    "psycopg[binary]>=3.1.18",
    "asyncpg>=0.29.0",
    "prometheus-client>=0.20.0",
    "psutil>=5.9.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.1",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
