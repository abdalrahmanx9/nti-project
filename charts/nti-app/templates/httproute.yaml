{{- if .Values.gateway.enabled -}}
# Kubernetes Gateway API: HTTPRoute Resource
# Routes HTTP traffic from the Gateway to the application Service.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "nti-app.fullname" . }}-httproute
  labels:
    {{- include "nti-app.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ include "nti-app.fullname" . }}-gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: {{ .Values.gateway.route.path | default "/" }}
      backendRefs:
        - name: {{ include "nti-app.fullname" . }}
          port: {{ .Values.service.port }}
{{- end }}
