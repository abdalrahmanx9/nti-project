{{- if and .Values.secretsManager .Values.secretsManager.enabled -}}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "nti-app.fullname" . }}-rds-secret
  labels:
    {{- include "nti-app.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ include "nti-app.fullname" . }}-secret-store
    kind: SecretStore
  target:
    name: {{ .Values.databaseSecret.name }}
    creationPolicy: Owner
  data:
    - secretKey: {{ .Values.databaseSecret.passwordKey }}
      remoteRef:
        key: {{ .Values.secretsManager.secretName }}
        property: password
---
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: {{ include "nti-app.fullname" . }}-secret-store
  labels:
    {{- include "nti-app.labels" . | nindent 4 }}
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ .Values.secretsManager.region }}
      auth:
        jwt:
          serviceAccountRef:
            name: {{ include "nti-app.serviceAccountName" . }}
{{- end }}
