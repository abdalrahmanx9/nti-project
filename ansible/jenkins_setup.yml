---
- name: Setup Jenkins Server & Complete DevOps Toolchain
  hosts: jenkins_servers
  become: true
  vars:
    jenkins_cli_url: "http://localhost:8080/jnlpJars/jenkins-cli.jar"
    jenkins_cli_dest: "/opt/jenkins-cli.jar"
    jenkins_plugins:
      - git
      - workflow-aggregator
      - github-branch-source
      - sonar
      - docker-workflow
      - amazon-ecr
      - pipeline-stage-view
      - credentials-binding
      - ansicolor

  tasks:
    - name: Clean up any stale Jenkins files from previous attempts
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/apt/sources.list.d/jenkins.list
        - /usr/share/keyrings/jenkins-keyring.asc
        - /etc/apt/keyrings/jenkins-keyring.asc

    - name: Clean up any stale Jenkins entry from sources.list if present
      lineinfile:
        path: /etc/apt/sources.list
        regexp: '.*pkg\.jenkins\.io.*'
        state: absent

    - name: Update apt cache and install base dependencies
      apt:
        update_cache: yes
        pkg:
          - curl
          - gnupg2
          - software-properties-common
          - apt-transport-https
          - ca-certificates
          - git
          - unzip
          - jq
          - tar
          - python3-pip
          - python3-venv
        state: present

    # 1. Install Java 25 (Latest supported runtime for Jenkins LTS)
    - name: Install OpenJDK 25
      apt:
        name:
          - openjdk-25-jdk-headless
          - openjdk-25-jre-headless
        state: present

    # 2. Add Official Jenkins Repository & Install Jenkins
    - name: Ensure /usr/share/keyrings directory exists
      file:
        path: /usr/share/keyrings
        state: directory
        mode: '0755'

    - name: Download Jenkins GPG Key (2026 key)
      get_url:
        url: https://pkg.jenkins.io/debian-stable/jenkins.io-2026.key
        dest: /usr/share/keyrings/jenkins-keyring.asc
        mode: '0644'
        force: yes

    - name: Add Jenkins APT repository list
      copy:
        content: "deb [signed-by=/usr/share/keyrings/jenkins-keyring.asc] https://pkg.jenkins.io/debian-stable binary/\n"
        dest: /etc/apt/sources.list.d/jenkins.list
        mode: '0644'

    - name: Install Jenkins LTS
      apt:
        name: jenkins
        state: present
        update_cache: yes

    - name: Reset any failed state and reload systemd
      systemd:
        daemon_reload: yes

    - name: Reset failed status for jenkins if any
      command: systemctl reset-failed jenkins
      ignore_errors: yes
      changed_when: false

    - name: Ensure Jenkins service is started and enabled
      systemd:
        name: jenkins
        state: started
        enabled: yes

    # 3. Install Docker Engine
    - name: Ensure /etc/apt/keyrings directory exists
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Download Docker official GPG key
      get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: '0644'

    - name: Add Docker APT repository list
      copy:
        content: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable\n"
        dest: /etc/apt/sources.list.d/docker.list
        mode: '0644'

    - name: Install Docker CE components
      apt:
        pkg:
          - docker-ce
          - docker-ce-cli
          - containerd.io
        state: present
        update_cache: yes

    - name: Ensure Docker service is running and enabled
      systemd:
        name: docker
        state: started
        enabled: yes

    - name: Add jenkins and ubuntu users to docker group
      user:
        name: "{{ item }}"
        groups: docker
        append: yes
      loop:
        - jenkins
        - ubuntu

    # 4. Install AWS CLI v2
    - name: Check if AWS CLI is installed
      command: aws --version
      register: aws_cli_check
      ignore_errors: yes
      changed_when: false

    - name: Install AWS CLI v2 if absent
      when: aws_cli_check.rc != 0
      block:
        - name: Download AWS CLI bundle
          get_url:
            url: "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip"
            dest: "/tmp/awscliv2.zip"

        - name: Unarchive AWS CLI bundle
          unarchive:
            src: "/tmp/awscliv2.zip"
            dest: "/tmp"
            remote_src: yes

        - name: Run AWS CLI installer
          command: "/tmp/aws/install"

    # 5. Install kubectl
    - name: Check if kubectl is installed
      command: kubectl version --client
      register: kubectl_check
      ignore_errors: yes
      changed_when: false

    - name: Install kubectl if absent
      when: kubectl_check.rc != 0
      get_url:
        url: "https://dl.k8s.io/release/v1.30.0/bin/linux/amd64/kubectl"
        dest: "/usr/local/bin/kubectl"
        mode: '0755'

    # 6. Install Helm v3
    - name: Check if Helm is installed
      command: helm version
      register: helm_check
      ignore_errors: yes
      changed_when: false

    - name: Install Helm v3 if absent
      when: helm_check.rc != 0
      shell: "curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash"

    # 7. Install Trivy (Container Vulnerability Scanner)
    - name: Download Trivy public signing key
      get_url:
        url: https://aquasecurity.github.io/trivy-repo/deb/public.key
        dest: /etc/apt/keyrings/trivy.asc
        mode: '0644'

    - name: Add Trivy APT repository list
      copy:
        content: "deb [signed-by=/etc/apt/keyrings/trivy.asc] https://aquasecurity.github.io/trivy-repo/deb generic main\n"
        dest: /etc/apt/sources.list.d/trivy.list
        mode: '0644'

    - name: Install Trivy
      apt:
        name: trivy
        state: present
        update_cache: yes

    # 8. Jenkins Security, Hardening & URL Initialization
    - name: Ensure /var/lib/jenkins/init.groovy.d directory exists
      file:
        path: /var/lib/jenkins/init.groovy.d
        state: directory
        owner: jenkins
        group: jenkins
        mode: '0755'

    - name: Deploy basic security and URL configuration script
      copy:
        src: files/basic-security.groovy
        dest: /var/lib/jenkins/init.groovy.d/basic-security.groovy
        owner: jenkins
        group: jenkins
        mode: '0644'

    - name: Deploy Jenkins hardening & agent configuration script
      copy:
        src: files/jenkins-hardening.groovy
        dest: /var/lib/jenkins/init.groovy.d/jenkins-hardening.groovy
        owner: jenkins
        group: jenkins
        mode: '0644'

    - name: Ensure deprecated monitor dismissal script is removed
      file:
        path: /var/lib/jenkins/init.groovy.d/fix-monitors.groovy
        state: absent

    - name: Restart Jenkins to apply initialization scripts
      systemd:
        name: jenkins
        state: restarted

    - name: Wait for Jenkins port 8080 to become available
      wait_for:
        port: 8080
        delay: 15
        timeout: 120

    - name: Read Jenkins Initial Admin Password
      slurp:
        src: /var/lib/jenkins/secrets/initialAdminPassword
      register: initial_admin_password_raw

    - name: Set initial admin password fact
      set_fact:
        jenkins_admin_password: "{{ initial_admin_password_raw.content | b64decode | trim }}"

    # 9. Automated Jenkins Plugin Installation
    - name: Download Jenkins CLI jar
      get_url:
        url: "{{ jenkins_cli_url }}"
        dest: "{{ jenkins_cli_dest }}"
        mode: '0755'

    - name: Install required Jenkins plugins via CLI
      command: >
        java -jar {{ jenkins_cli_dest }} -s http://{{ ansible_host }}:8080/
        -auth admin:{{ jenkins_admin_password }}
        install-plugin {{ item }} -deploy
      loop: "{{ jenkins_plugins }}"
      register: plugin_install_res
      changed_when: "'Installed' in plugin_install_res.stdout or plugin_install_res.rc == 0"
      retries: 3
      delay: 5
      until: plugin_install_res.rc == 0
      ignore_errors: yes

    - name: Restart Jenkins to apply plugins
      systemd:
        name: jenkins
        state: restarted

    # 10. Configure Distributed Build Agent
    - name: Ensure agent directories exist
      file:
        path: "{{ item }}"
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: '0755'
      loop:
        - /opt/jenkins-agent
        - /home/ubuntu/jenkins-agent

    - name: Download Jenkins Agent jar
      get_url:
        url: "http://localhost:8080/jnlpJars/agent.jar"
        dest: "/opt/jenkins-agent/agent.jar"
        owner: ubuntu
        group: ubuntu
        mode: '0755'

    - name: Create systemd unit for Jenkins build agent
      copy:
        dest: /etc/systemd/system/jenkins-agent.service
        content: |
          [Unit]
          Description=Jenkins Distributed Build Agent
          After=network.target jenkins.service
          Wants=jenkins.service

          [Service]
          Type=simple
          User=ubuntu
          Group=ubuntu
          WorkingDirectory=/home/ubuntu/jenkins-agent
          ExecStart=/bin/bash -c '/usr/bin/java -jar /opt/jenkins-agent/agent.jar -url http://{{ ansible_host }}:8080/ -secret $$(cat /var/lib/jenkins/agent-secret.txt) -name build-agent -workDir /home/ubuntu/jenkins-agent -webSocket'
          Restart=always
          RestartSec=10

          [Install]
          WantedBy=multi-user.target
        mode: '0644'

    - name: Enable and start Jenkins build agent service
      systemd:
        name: jenkins-agent
        state: started
        enabled: yes
        daemon_reload: yes

    - name: Display Jenkins Setup Credentials
      debug:
        msg:
          - "=========================================================="
          - " Jenkins has been successfully installed and configured!   "
          - " URL: http://{{ ansible_host }}:8080                      "
          - " Initial Admin Password: {{ jenkins_admin_password }}     "
          - " Installed Toolchain: Docker, AWS CLI v2, kubectl, Helm, Trivy "
          - "=========================================================="
