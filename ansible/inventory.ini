# Inventory for NTI DevOps Project EC2 Instances
# Replace YOUR_JENKINS_PUBLIC_IP with the output from `terraform output -raw jenkins_public_ip`
# Replace ~/.ssh/your-key.pem with your AWS EC2 private key path

[jenkins_servers]
jenkins_master ansible_host=98.86.85.33 ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/nti-devops-key.pem

[all_ec2:children]
jenkins_servers

[all:vars]
ansible_python_interpreter=/usr/bin/python3
