# Inventory Example for NTI DevOps Project EC2 Instances
# Copy this file to inventory.ini and update with your actual EC2 public IP and key path

[jenkins_servers]
jenkins_master ansible_host=YOUR_JENKINS_PUBLIC_IP ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/your-key.pem

[all_ec2:children]
jenkins_servers

[all:vars]
ansible_python_interpreter=/usr/bin/python3
